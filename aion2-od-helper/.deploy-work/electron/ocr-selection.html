<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OCR 영역 지정</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      cursor: crosshair;
      user-select: none;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    #instruction {
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-weight: bold;
      text-align: center;
      pointer-events: none;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    
    #instruction span {
      display: block;
      font-size: 12px;
      font-weight: normal;
      color: #94a3b8;
      margin-top: 4px;
    }
    
    #selection-box {
      position: absolute;
      border: 2px solid #ef4444; /* Red border */
      background: rgba(239, 68, 68, 0.2); /* Semi-transparent red */
      display: none;
      pointer-events: none;
      z-index: 50;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4); /* Darken everything outside */
    }
    
    /* Remove body background when selecting to use the box-shadow trick */
    body.selecting {
      background: transparent;
    }
  </style>
</head>
<body>
  <div id="instruction">
    마우스로 드래그하여 오드 에너지가 표시되는 숫자 영역을 지정하세요.
    <span>(취소하려면 ESC 키를 누르세요)</span>
  </div>
  <div id="selection-box"></div>

  <script>
    const { ipcRenderer } = require('electron');
    
    let isDrawing = false;
    let startX = 0;
    let startY = 0;
    
    const box = document.getElementById('selection-box');
    
    window.addEventListener('mousedown', (e) => {
      isDrawing = true;
      startX = e.clientX;
      startY = e.clientY;
      
      document.body.classList.add('selecting');
      box.style.display = 'block';
      box.style.left = startX + 'px';
      box.style.top = startY + 'px';
      box.style.width = '0px';
      box.style.height = '0px';
    });
    
    window.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      
      const currentX = e.clientX;
      const currentY = e.clientY;
      
      const width = Math.abs(currentX - startX);
      const height = Math.abs(currentY - startY);
      const left = Math.min(currentX, startX);
      const top = Math.min(currentY, startY);
      
      box.style.left = left + 'px';
      box.style.top = top + 'px';
      box.style.width = width + 'px';
      box.style.height = height + 'px';
    });
    
    window.addEventListener('mouseup', (e) => {
      if (!isDrawing) return;
      isDrawing = false;
      
      const currentX = e.clientX;
      const currentY = e.clientY;
      
      const width = Math.abs(currentX - startX);
      const height = Math.abs(currentY - startY);
      const left = Math.min(currentX, startX);
      const top = Math.min(currentY, startY);
      
      // If the selected area is too small, assume it was a click and cancel
      if (width < 10 || height < 10) {
        ipcRenderer.send('ocr-selection-cancel');
        return;
      }
      
      // Calculate scaled coordinates based on devicePixelRatio
      // For multi-monitor setups with different scaling, this gets tricky,
      // but assuming primary display for now.
      const scale = window.devicePixelRatio || 1;
      
      const region = {
        x: Math.round(left * scale),
        y: Math.round(top * scale),
        width: Math.round(width * scale),
        height: Math.round(height * scale)
      };
      
      // Send the region back to main process
      ipcRenderer.send('ocr-region-selected', region);
    });
    
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        ipcRenderer.send('ocr-selection-cancel');
      }
    });
  </script>
</body>
</html>
